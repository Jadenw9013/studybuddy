name: Synthetic regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_MODE: fixture
      PYTHON_PATH: .venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - run: corepack enable && corepack prepare pnpm@10.30.3 --activate
      - run: python -m pip install uv==0.13.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup && pnpm seed:demo
      - run: pnpm verify:handoff && pnpm typecheck && pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e && pnpm build
      - run: pnpm db:start && pnpm db:migrate
      - run: node supabase/tests/run.mjs
      - run: mkdir -p .data && pnpm exec supabase status --output json > .data/supabase-local-status.json
      - run: node --import tsx evals/db/service.ts
      - run: node --import tsx evals/db/illustration-service.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evidence
          path: |
            evals/results
            playwright-report
            test-results

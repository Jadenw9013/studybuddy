[project]
name = "live-tutor-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pypdf==6.21.4", "nbformat==5.10.4", "reportlab==4.4.10"]

[project.optional-dependencies]
embeddings = ["sentence-transformers==5.1.1", "torch==2.9.1+cpu"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
